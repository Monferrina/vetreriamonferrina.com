# Dependabot version updates.
#
# Nota su cosa copre cosa: gli *alert di sicurezza* girano su tutto il repository
# a prescindere da questo file. Gli *aggiornamenti di versione*, invece, seguono
# solo quello che è dichiarato qui: senza il blocco delle GitHub Actions i pin
# per SHA non verrebbero mai aggiornati.
version: 2
updates:
  # Dipendenze del sito.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Una versione appena pubblicata può essere malevola o rotta: si aspetta una
    # settimana prima di proporla. Vale solo per gli aggiornamenti di versione, gli
    # aggiornamenti di sicurezza non aspettano (doc GitHub, opzione cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # Minor e patch in un'unica PR: meno rumore e meno run CI. Le major restano
    # separate, perché vanno valutate a mano (v. typescript 6→7).
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        # PR a parte: va aggiornata a mano anche l'immagine del container in e2e.yml, e
        # finché non lo si fa il suo E2E è rosso; dentro il gruppo fermerebbe tutto il resto.
        exclude-patterns:
          - '@playwright/test'

  # GitHub Actions. Necessario perché i workflow sono pinnati per SHA: senza
  # questo blocco i pin non verrebbero mai aggiornati e il repo resterebbe
  # fermo a versioni vecchie per sempre — peggio dei tag mobili.
  - package-ecosystem: 'github-actions'
    # Con directory '/' Dependabot legge solo .github/workflows e un action.yml in
    # radice: i pin della action composita del setup comune resterebbero fermi.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-all:
        patterns:
          - '*'
