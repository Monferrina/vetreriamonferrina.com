name: E2E

# Gli E2E girano sul build di produzione, cioè sulla preview Vercel della PR: Vercel crea un
# deployment GitHub con lo SHA della PR e, a build finita, lo stato "success" con l'URL
# (misurato il 05/10). Il run parte da quello SHA (GITHUB_SHA = "commit to be deployed") e il
# check si attacca alla PR.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    # Un job saltato vale "Success" per un check obbligatorio (doc GitHub): il nome del ruleset
    # lo prende solo quando gira, così un deploy di produzione o fallito non sblocca la PR.
    name: ${{ github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview' && 'E2E (Playwright)' || 'E2E (non eseguito)' }}
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
