name: E2E sulla preview Vercel

# Gli E2E girano sul build di produzione, cioè sulla preview Vercel della PR: Vercel crea un
# deployment GitHub con lo SHA della PR e, a build finita, lo stato "success" con l'URL
# (misurato il 05/10). Il run parte da quello SHA (GITHUB_SHA = "commit to be deployed") e il
# check si attacca alla PR.

on:
  deployment_status:

permissions:
  contents: read

# Niente concurrency: il ref del deployment è lo SHA, non il ramo, quindi un run superato da un
# push nuovo non si cancella. Si accetta: costa un run da ~2 minuti, gratuito su repo pubblica.

jobs:
  e2e:
    # Vercel manda un solo stato per deployment, success o failure (misurato su 30 il 05/10).
    # Il job gira su ogni deployment di Preview e fallisce se la preview non è pronta: una
    # preview rotta dà un check rosso. Su Production è saltato; un job saltato vale "Success"
    # per un check obbligatorio (doc GitHub), ma Production è sempre su uno SHA di main, mai
    # sulla testa di una PR.
    name: E2E (Playwright)
    if: github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Token OIDC di GitHub per Trusted Sources di Vercel (TS1), solo in questo job.
      id-token: write
    # Browser e librerie di sistema già nell'immagine ufficiale (doc Playwright): niente apt a
    # ogni run (#367: 14m38s). Tag = versione di @playwright/test, a mano (CONTRIBUTING.md).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host

    steps:
      - name: Preview pronta
        if: github.event.deployment_status.state != 'success'
        run: |
          echo "::error::Deployment di Preview in stato '$STATO', niente da testare"
          exit 1
        env:
          STATO: ${{ github.event.deployment_status.state }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Sonda temporanea (TS1): claim del token OIDC di GitHub e risposta della preview con il
      # solo token, prima e dopo la configurazione di Trusted Sources. Si toglie nella stessa PR.
      - name: Sonda Trusted Sources
        run: |
          node --input-type=module <<'EOF'
          const { ACTIONS_ID_TOKEN_REQUEST_URL: url, ACTIONS_ID_TOKEN_REQUEST_TOKEN: rt, BASE_URL } = process.env;
          const { value: token } = await (await fetch(url, { headers: { authorization: `bearer ${rt}` } })).json();
          console.log(`::add-mask::${token}`);
          const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
          console.log(JSON.stringify({ aud: c.aud, sub: c.sub, repository: c.repository, ref: c.ref, event_name: c.event_name, workflow_ref: c.workflow_ref, job_workflow_ref: c.job_workflow_ref, environment: c.environment, durata_s: c.exp - c.iat, nbf_s: c.iat - c.nbf }));
          for (const [nome, headers] of [['senza token', {}], ['con token', { 'x-vercel-trusted-oidc-idp-token': token }]]) {
            const res = await fetch(BASE_URL, { headers, redirect: 'manual' });
            const loc = res.headers.get('location');
            const titolo = (await res.text()).match(/<title>(.*?)<\/title>/)?.[1];
            console.log(nome, res.status, loc ? new URL(loc, BASE_URL).pathname : '', titolo ?? '');
          }
          EOF
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
