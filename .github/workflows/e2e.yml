name: E2E

# Gli E2E girano sul build di produzione, cioè sulla preview Vercel della PR: Vercel crea un
# deployment GitHub con lo SHA della PR e, a build finita, lo stato "success" con l'URL
# (misurato il 05/10). Il run parte da quello SHA (GITHUB_SHA = "commit to be deployed") e il
# check si attacca alla PR.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    # Vercel manda un solo stato per deployment, success o failure (misurato su 30 il 05/10).
    # Il job gira su ogni deployment di Preview e fallisce se la preview non è pronta: una
    # preview rotta dà un check rosso. Su Production è saltato; un job saltato vale "Success"
    # per un check obbligatorio (doc GitHub), ma Production è sempre su uno SHA di main, mai
    # sulla testa di una PR.
    name: E2E (Playwright)
    if: github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browser e loro librerie di sistema sono già nell'immagine ufficiale (doc Playwright, "CI"
    # e "Docker"): niente apt a ogni run (#367: 14m38s di apt). Il tag va tenuto uguale alla
    # versione di @playwright/test, altrimenti Playwright non trova i browser.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host

    steps:
      - name: Preview pronta
        if: github.event.deployment_status.state != 'success'
        run: |
          echo "::error::Deployment di Preview in stato '$STATO', niente da testare"
          exit 1
        env:
          STATO: ${{ github.event.deployment_status.state }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
