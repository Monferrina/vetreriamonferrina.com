name: Scansione settimanale HawkScan

# DAST della produzione una volta a settimana (H1): trova anche le vulnerabilità nuove su
# codice che non cambia. Su ogni PR no (decisione 2/10). POST /api/send-quote resta escluso
# da stackhawk.yml: in produzione manderebbe email vere.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hawkscan:
    name: HawkScan produzione
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HawkScan
        uses: stackhawk/hawkscan-action@9d8651a084df3a0b71a47de3c74bbb9be6986b41 # v3.1.1
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          HAWK_AGENT: github-actions
          # Il Bot Fight Mode di Cloudflare risponde ai runner GitHub con una challenge (403,
          # scan c8106a85: 3 URL, tutti di Cloudflare) e nessuna regola lo puo' saltare. Si
          # scansiona l'alias Vercel di produzione: stessa app, stessi header.
          APP_HOST: https://vetreriamonferrina.vercel.app
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          # La CLI misurata in locale il 05/10; latest cambierebbe senza una PR.
          version: 6.5.0
          configurationFiles: stackhawk.yml
