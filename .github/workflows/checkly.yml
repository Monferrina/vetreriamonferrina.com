name: Monitor Checkly

# Monitoring as code: quando il deploy di produzione è pronto deploya tutti i check su Checkly.
# I check presuppongono la produzione (Worker) e non girano sulle PR: un `checkly test` contro la
# produzione prima del merge ha mandato email vere alla vetreria (08/10/2026, #400). Se i secret
# non sono configurati, lo step si skippa.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  deploy:
    # Dopo il deploy di produzione, non al push su main: Checkly esegue subito un check nuovo, e
    # al push la produzione è ancora quella vecchia. Con #400 un check nuovo è partito alle
    # 21:11:34 UTC, il deploy di produzione era pronto alle 21:12:43: 200 al posto di 403 e
    # un'email vera alla vetreria. Gira su ogni deploy di produzione (il filtro sui file non
    # vale per deployment_status): `checkly deploy` è idempotente e costa pochi secondi.
    name: Deploy Monitors
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: checkly-deploy
      cancel-in-progress: true
    env:
      CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
      CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy checks
        if: ${{ env.CHECKLY_API_KEY != '' }}
        run: npx checkly deploy --force
