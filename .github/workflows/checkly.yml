name: Monitor Checkly

# Monitoring as code: sulle PR prova i check con tag `preview` contro la preview Vercel della PR
# (stesso evento e stesso URL di e2e.yml); quando il deploy di produzione è pronto deploya tutti
# i check su Checkly. I check senza tag presuppongono la produzione (Worker, lockdown, chiavi
# Turnstile vere) e non girano sulle PR: un `checkly test` contro la produzione prima del merge ha
# mandato email vere alla vetreria (08/10/2026, #400). Se i secret non sono configurati, gli step
# si skippano.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview:
    # Come e2e.yml: Vercel crea un deployment GitHub con lo SHA della PR e, a build finita, lo
    # stato "success" con l'URL. Gira su ogni preview (un check browser per run): il filtro sui
    # file non vale per deployment_status.
    name: Test monitors (preview)
    if: github.event_name == 'deployment_status' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
      CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
    steps:
      - name: Preview pronta
        if: github.event.deployment_status.state != 'success'
        run: |
          echo "::error::Deployment di Preview in stato '$STATO', niente da testare"
          exit 1
        env:
          STATO: ${{ github.event.deployment_status.state }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test checks tagged preview
        if: ${{ env.CHECKLY_API_KEY != '' }}
        run: npx checkly test --tags preview -e "PREVIEW_URL=$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}

  deploy:
    # Dopo il deploy di produzione, non al push su main: Checkly esegue subito un check nuovo, e
    # al push la produzione è ancora quella vecchia. Con #400 il check negativo di Turnstile è
    # partito alle 21:11:34 UTC, il deploy di produzione era pronto alle 21:12:43: 200 al posto di
    # 403 e un'email vera alla vetreria. Gira su ogni deploy di produzione (il filtro sui file non
    # vale per deployment_status): `checkly deploy` è idempotente e costa pochi secondi.
    name: Test & Deploy Monitors
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: checkly-deploy
      cancel-in-progress: true
    env:
      CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
      CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy checks
        if: ${{ env.CHECKLY_API_KEY != '' }}
        run: npx checkly deploy --force
