name: Sicurezza

# Audit delle dipendenze, CodeQL e regole Semgrep della repo. La scansione Semgrep
# della piattaforma (semgrep-cloud-platform/scan) e Aikido arrivano dalle loro app;
# segreti: secret scanning e push protection di GitHub, attivi sulla repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  # L'evento nel gruppo: il cron del lunedì e un push su main non si cancellano a vicenda.
  group: sicurezza-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job a parte, senza needs: un audit rosso dentro "quality" faceva saltare
  # lint, test, build e SonarCloud, e i check obbligatori non arrivavano (#339).
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # npm audit legge dal solo lockfile, quindi non serve npm ci.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  # CodeQL in advanced setup: il default setup non gira sul merge_group, e serve
  # un file nostro per le PR da fork (A4).
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # Regole su misura della repo (.semgrep/): prima i loro test, poi la scansione.
  # Senza token: la piattaforma Semgrep non le vede, le applica solo questo job.
  semgrep:
    name: Semgrep (regole della repo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 # 1.177.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lanciato dalla radice, `semgrep --test .semgrep` non trova i test (cartella
      # nascosta) ed esce 0 lo stesso: dentro la cartella li trova e fallisce davvero.
      - name: Test delle regole
        working-directory: .semgrep
        run: semgrep --test .

      - name: Scansione con le regole
        run: semgrep scan --config .semgrep --exclude .semgrep --error --metrics off
