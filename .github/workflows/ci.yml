name: 'Qualità: lint, tipi, test, build'

# Qualità del codice, test e dipendenze introdotte dalla PR; gli E2E stanno in e2e.yml, sulla
# preview Vercel. SAST: CodeQL e Semgrep dalle loro app. I nomi dei job sono quelli del ruleset
# protect-main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

  dependency-review:
    name: Dependency Review
    # Blocca le dipendenze vulnerabili che la PR introduce, transitive comprese;
    # quelle già su main le segnala Dependabot. Lavora sul diff via API, senza checkout.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
