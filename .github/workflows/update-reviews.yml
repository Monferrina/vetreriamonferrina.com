name: Aggiorna Recensioni Google

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.REVIEWS_PAT }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch dati Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-place-data.mjs

      - name: Crea PR se dati cambiati
        env:
          GH_TOKEN: ${{ secrets.REVIEWS_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json src/data/opening-hours.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento"
            exit 0
          fi
          BRANCH="chore/update-reviews-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: aggiorna recensioni e orari Google"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: aggiorna recensioni Google $(date +%Y-%m-%d)" \
            --body "Aggiornamento automatico recensioni e orari da Google Places API." \
            --base main
          # Nessun merge automatico: la PR resta aperta per revisione umana (gate AI Act).
