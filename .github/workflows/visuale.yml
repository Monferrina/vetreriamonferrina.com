name: Visuale

# Regola 17 in automatico: screenshot desktop e mobile della preview Vercel della
# PR, con ogni risorsa sotto 400 e nessun errore CSP. Gira sulla preview perché la
# CSP sta in vercel.json e solo Vercel la applica. Non è un check obbligatorio: gli
# screenshot li guarda Marco prima del merge delle modifiche visibili.
# La preview è protetta da Vercel Authentication: serve il segreto "Protection
# Bypass for Automation" del progetto. Senza, il workflow avvisa e non scatta.

on:
  pull_request:
    branches: [main]
    # Le PR che non cambiano il sito non hanno niente da fotografare.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/unit/**'
      - '.semgrep/**'

concurrency:
  group: visuale-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Attendi la preview Vercel
    # Le PR da fork non ricevono segreti: il bypass sarebbe vuoto.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      deployments: read
    outputs:
      url: ${{ steps.url.outputs.url }}

    steps:
      - name: URL della preview
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          if [ "$HAS_BYPASS" != true ]; then
            echo "::warning::Manca VERCEL_AUTOMATION_BYPASS_SECRET: niente screenshot."
            exit 0
          fi
          # Vercel crea il deployment GitHub "Preview" sullo SHA della PR; si aspetta
          # che il suo stato diventi success, al massimo 15 minuti.
          id=
          for _ in $(seq 60); do
            # || true: un errore passeggero dell'API (502) non deve chiudere l'attesa.
            [ -n "$id" ] || id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Preview" --jq '.[0].id // empty' || true)
            if [ -n "$id" ]; then
              read -r state url < <(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0] | "\(.state) \(.environment_url)"' || true) || true
              case "$state" in
                success)
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                failure|error)
                  echo "::error::Preview Vercel in stato $state."
                  exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::Preview Vercel non pronta dopo 15 minuti."
          exit 1

  screenshot:
    name: Screenshot della preview
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Immagine ufficiale di Playwright con la versione installata dal lockfile:
      # Dependabot aggiorna @playwright/test da solo e un'immagine fissata resterebbe
      # indietro (browser mancanti). Utente del runner, proprietario della workspace.
      - name: Screenshot e controlli
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w -e HOME=/tmp \
            -e PREVIEW_URL -e VERCEL_AUTOMATION_BYPASS_SECRET \
            "mcr.microsoft.com/playwright:v$v-noble" \
            npx playwright test --config tests/visuale/playwright.config.ts
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visuale-report
          path: visuale-report/
          retention-days: 14
