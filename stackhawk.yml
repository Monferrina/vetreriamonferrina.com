# HawkScan, scansione della produzione (env Production): settimanale da programmati.yml.
# Per la preview Vercel di una PR si aggiunge stackhawk-preview.yml (vince il file dopo).
app:
  applicationId: 60a7a4e9-1923-4cad-a266-918a20d03404
  env: Production
  host: ${APP_HOST:https://vetreriamonferrina.com}
  # Ogni POST che arriva in produzione manda una email vera tramite Resend e consuma il
  # rate limit dei clienti. Il controllo sta in tests/unit/stackhawk-config.test.ts.
  excludePaths:
    - '^/api/send-quote'
  # Vercel Authentication protegge tutte le deployment (AL1): senza il bypass l'alias
  # risponde con il login Vercel. Sta in authentication perché lì StackHawk lo oscura
  # anche nella config caricata ('[REDACTED]', misurato 05/10 con un valore finto); messo
  # nel replacer finiva in chiaro sulla piattaforma (scan 47b0ee7c). Il controllo sta in
  # tests/unit/stackhawk-config.test.ts.
  authentication:
    external:
      values:
        - type: TOKEN
          value:
            name: x-vercel-protection-bypass
            val: ${VERCEL_AUTOMATION_BYPASS_SECRET}
    # Senza bypass Vercel risponde con un redirect al login, con il bypass 200.
    testPath:
      path: /
      success: '.*200.*'
  redact:
    headers:
      - x-vercel-protection-bypass
    values:
      - ${VERCEL_AUTOMATION_BYPASS_SECRET}

hawk:
  # Un Medium o un High fa uscire la scansione con 42: il job settimanale fallisce e
  # GitHub lo notifica (Marco, 05/10).
  failureThreshold: medium

tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  # Nessun repo collegato in Attack Surface Management (hawk op repo list vuoto, 05/10).
  - name: git_origin
    value: monferrina/vetreriamonferrina.com
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
