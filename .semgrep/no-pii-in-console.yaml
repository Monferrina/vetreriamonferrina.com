rules:
  - id: no-pii-in-console
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      IP o dati del form preventivi in un console.*: finiscono nei log di Vercel e,
      come breadcrumb, negli eventi Sentry (CLAUDE.md, "Dati personali";
      docs/mappa-dati.md). Togli il dato dal log.
    metadata:
      category: security
      confidence: HIGH
    mode: taint
    pattern-sources:
      - pattern: $REQ.ip
      - pattern: $CTX.clientAddress
      - patterns:
          - pattern: $REQ.headers.get($H)
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^['"](x-forwarded-for|x-real-ip|cf-connecting-ip|true-client-ip)['"]$
      # Il corpo della richiesta è il form: nome, email, telefono, descrizione.
      # Solo la richiesta in arrivo: fetch(...).json() o document.body non sono il form.
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - pattern: sanitizeFormData(...)
    # In Semgrep CE ogni chiamata passa il taint dagli argomenti al risultato: la
    # risposta del provider email (id, errore) risulterebbe "contenere" il form.
    # Solo il mittente di send-quote: un .send qualunque (ws, res) non ripulisce niente.
    pattern-sanitizers:
      - pattern: emailSender.send(...)
    pattern-sinks:
      - patterns:
          - pattern: console.$M(..., $ARG, ...)
          - focus-metavariable: $ARG
